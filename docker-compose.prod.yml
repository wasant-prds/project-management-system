# Docker Compose for Production Environment
# Features: Optimized build, security hardening, environment variable mapping

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pms-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-project_management_prod}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pms-network-prod
    command: 
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=2621kB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"

  # Next.js Application (Production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        - NODE_ENV=production
    container_name: pms-app-prod
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-project_management_prod}?schema=public&connection_limit=10&pool_timeout=20
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - PORT=${APP_PORT:-3000}
      - HOSTNAME=0.0.0.0
    ports:
      - "${APP_PORT:-3002}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pms-network-prod
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Database Migrations Runner
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: pms-migrations-prod
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-project_management_prod}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pms-network-prod
    command: sh -c "pnpm db:push"
    profiles:
      - init

  # Database Backup Service (Optional)
  backup:
    image: postgres:16-alpine
    container_name: pms-backup-prod
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-project_management_prod}
      - BACKUP_KEEP_DAYS=7
    volumes:
      - ./backups:/backups
    depends_on:
      - postgres
    networks:
      - pms-network-prod
    command: sh -c "
      while true; do
        pg_dump -h postgres -U $${POSTGRES_USER} -d $${POSTGRES_DB} > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql;
        find /backups -type f -name '*.sql' -mtime +$${BACKUP_KEEP_DAYS} -delete;
        sleep 86400;
      done
      "
    profiles:
      - backup

networks:
  pms-network-prod:
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local

