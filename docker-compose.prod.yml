name: project-management-system-production

include:
  - docker-compose.database.yml

services:
  postgres:
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=2621kB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  app:
    build:
      context: .
      target: production
      args:
        NEXT_PUBLIC_ENV: production
    container_name: pms-app-prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_ENV: production
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
    ports:
      - "${APP_PORT:-3002}:3000"
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }
        reservations: { cpus: "0.5", memory: 512M }

  backup:
    profiles: [backup]
    image: postgres:16-alpine
    container_name: pms-backup-prod
    restart: always
    secrets: [postgres_user, postgres_password, postgres_db]
    environment:
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [pms-network]
    command: >
      sh -c "export POSTGRES_USER=$$(tr -d '\n\r' < /run/secrets/postgres_user | xargs)
      && export POSTGRES_PASSWORD=$$(tr -d '\n\r' < /run/secrets/postgres_password | xargs)
      && export POSTGRES_DB=$$(tr -d '\n\r' < /run/secrets/postgres_db | xargs)
      && while true; do
           PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB
             | gzip > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql.gz;
           find /backups -type f -name 'backup_*' -mtime +$$BACKUP_KEEP_DAYS -delete;
           sleep 86400;
         done"
