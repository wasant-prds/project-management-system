# Docker Compose for Production Environment
# Features: Optimized build, Docker secrets, security hardening

name: project-management-system-production

include:
  - path: docker-compose.database.yml

services:
  postgres:
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=2621kB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"

  # Next.js Application (Production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_ENV: production
    container_name: pms-app-prod
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_ENV=production
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      - "${APP_PORT:-3002}:3000"
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - pms-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    # DATABASE_URL → scripts/docker-entrypoint-app.sh
    # postgres + schema push → docker-compose.database.yml; seed off in production

  # Database Backup Service (Optional)
  backup:
    image: postgres:16-alpine
    container_name: pms-backup-prod
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    environment:
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pms-network
    command: sh -c "
      export POSTGRES_USER=$$(cat /run/secrets/postgres_user | tr -d '\n\r' | xargs) &&
      export POSTGRES_PASSWORD=$$(cat /run/secrets/postgres_password | tr -d '\n\r' | xargs) &&
      export POSTGRES_DB=$$(cat /run/secrets/postgres_db | tr -d '\n\r' | xargs) &&
      while true; do
        PGPASSWORD=$${POSTGRES_PASSWORD} pg_dump -h postgres -U $${POSTGRES_USER} -d $${POSTGRES_DB} > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql;
        find /backups -type f -name '*.sql' -mtime +$${BACKUP_KEEP_DAYS} -delete;
        sleep 86400;
      done
      "
    profiles:
      - backup

networks:
  pms-network:
    driver: bridge

secrets:
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  postgres_db:
    file: ./secrets/postgres_db.txt
