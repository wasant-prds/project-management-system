name: project-management-system-production

include:
  - docker-compose.database.yml

services:
  postgres:
    command: >
      postgres
      -c timezone=Asia/Bangkok
      -c max_connections=20
      -c shared_buffers=64MB
      -c effective_cache_size=192MB
      -c maintenance_work_mem=32MB
      -c work_mem=2MB
      -c wal_buffers=4MB
      -c min_wal_size=64MB
      -c max_wal_size=256MB
      -c checkpoint_completion_target=0.9
      -c wal_compression=on
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=50
      -c huge_pages=off

  app:
    build:
      context: .
      target: production
      args:
        NEXT_PUBLIC_ENV: production
    container_name: pms-app-prod
    restart: always
    environment:
      APP_ENV: prod
      NODE_ENV: production
      NEXT_PUBLIC_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
    deploy:
      resources:
        limits: { cpus: "0.30", memory: 384M }
        reservations: { cpus: "0.10", memory: 128M }
    ports:
      - "127.0.0.1:${APP_PORT:-3002}:3000"

  backup:
    profiles: [backup]
    image: postgres:16-alpine
    container_name: pms-backup-prod
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits: { cpus: "0.10", memory: 64M }
        reservations: { cpus: "0.02", memory: 32M }
    environment:
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
      PGOPTIONS: -c timezone=Asia/Bangkok
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in root .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-3}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [pms-network]
    command: >
      sh -c "while true; do
           PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h postgres -U $$POSTGRES_USER -d $$POSTGRES_DB
             | gzip > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql.gz;
           find /backups -type f -name 'backup_*' -mtime +$$BACKUP_KEEP_DAYS -delete;
           sleep 86400;
         done"
