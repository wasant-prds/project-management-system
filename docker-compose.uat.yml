# Docker Compose for UAT (User Acceptance Testing) Environment
# Features: Production-like build, Docker secrets, PostgreSQL

name: project-management-system-uat

include:
  - path: docker-compose.database.yml

services:
  # Next.js Application (UAT)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: uat
      args:
        NEXT_PUBLIC_ENV: uat
    container_name: pms-app-uat
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_ENV=uat
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3001}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      - "${APP_PORT:-3001}:3000"
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - pms-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # DATABASE_URL → scripts/docker-entrypoint-app.sh
    # postgres + schema push + seed → docker-compose.database.yml

networks:
  pms-network:
    driver: bridge

secrets:
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  postgres_db:
    file: ./secrets/postgres_db.txt
