name: project-management-system-uat

include:
  - docker-compose.database.yml

services:
  app:
    build:
      context: .
      target: uat
      args:
        NEXT_PUBLIC_ENV: uat
    container_name: pms-app-uat
    restart: unless-stopped
    environment:
      APP_ENV: uat
      NODE_ENV: production
      NEXT_PUBLIC_ENV: uat
      NODE_OPTIONS: --max-old-space-size=256
    deploy:
      resources:
        limits: { cpus: "0.30", memory: 384M }
        reservations: { cpus: "0.10", memory: 128M }
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
