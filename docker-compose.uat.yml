name: project-management-system-uat

include:
  - docker-compose.database.yml

services:
  app:
    build:
      context: .
      target: uat
      args:
        NEXT_PUBLIC_ENV: uat
    container_name: pms-app-uat
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_ENV: uat
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NODE_OPTIONS: --max-old-space-size=256
    ports:
      - "${APP_PORT:-3001}:3000"
