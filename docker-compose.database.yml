# Shared postgres + migrations. Included by the env compose files.
# SEED_PATH is relative to /app/database (prisma/seed.ts).
#
# Sized for a Basic VPS (1 vCPU / 2 GB RAM / 50 GB disk) running two
# projects at once. This stack budgets ~0.5 CPU and ~768 MB so the
# other project can take a similar share; leave ~400 MB for the OS.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: pms-postgres-${APP_ENV:-dev}
    restart: ${POSTGRES_RESTART:-unless-stopped}
    secrets: [postgres_user, postgres_password, postgres_db]
    ports:
      - "${POSTGRES_PORT:-5437}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/init-postgres.sh:ro
      - ./backups:/backups
    shm_size: 128mb
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.20", memory: 384M }
        reservations: { cpus: "0.05", memory: 96M }
    environment:
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    healthcheck:
      test: pg_isready -U $$(cat /run/secrets/postgres_user) -d $$(cat /run/secrets/postgres_db)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [pms-network]
    # Invoke via sh so a missing +x or noexec bind-mount does not fail
    # (git tracks this script as 100644; Linux clones are not executable).
    entrypoint: ["sh", "/init-postgres.sh"]
    command: >
      postgres
      -c max_connections=20
      -c shared_buffers=64MB
      -c effective_cache_size=192MB
      -c maintenance_work_mem=32MB
      -c work_mem=2MB
      -c wal_buffers=4MB
      -c min_wal_size=64MB
      -c max_wal_size=256MB
      -c checkpoint_completion_target=0.9
      -c huge_pages=off
      -c random_page_cost=1.1

  migrations:
    build:
      context: .
      target: migrate
    container_name: pms-migrations-${APP_ENV:-dev}
    secrets: [postgres_user, postgres_password, postgres_db]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [pms-network]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.40", memory: 256M }
        reservations: { cpus: "0.05", memory: 64M }
    environment:
      SEED_PATH: ${SEED_PATH:-seeds/master}
      SEEDS_ROOT: /app/database
      RUN_SEED: ${RUN_SEED:-true}
      NODE_OPTIONS: --max-old-space-size=192
    volumes:
      - ./prisma:/app/prisma
      - ./database/seeds:/app/database/seeds:ro
      - ./scripts:/app/scripts:ro

  app:
    secrets: [postgres_user, postgres_password, postgres_db]
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks: [pms-network]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.30", memory: 384M }
        reservations: { cpus: "0.10", memory: 128M }
    environment:
      NODE_OPTIONS: --max-old-space-size=256

volumes:
  postgres_data:
    name: pms-postgres-data-${APP_ENV:-dev}
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_DATA_DIR:-./database/postgres/data}
    labels:
      com.dhas.project: project-management-system
      com.dhas.environment: ${APP_ENV:-dev}
      com.dhas.volume.type: database
      com.dhas.backup.frequency: daily
      com.dhas.retention.days: "3"

networks:
  pms-network:
    driver: bridge

secrets:
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  postgres_db:
    file: ./secrets/postgres_db.txt
