# Shared postgres + migrations. Included by the env compose files.
# SEED_PATH is relative to /app. Default is the SQL master pack, applied only when RUN_SEED=true.
#
# Sized for a Basic VPS (1 vCPU / 2 GB RAM / 50 GB disk) running two
# projects at once. This stack budgets ~0.5 CPU and ~768 MB so the
# other project can take a similar share; leave ~400 MB for the OS.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-database-env: &database-env
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in root .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in root .env}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  TZ: Asia/Bangkok
  PGTZ: Asia/Bangkok
  PGOPTIONS: -c timezone=Asia/Bangkok

services:
  postgres:
    image: postgres:16-alpine
    container_name: pms-postgres-${APP_ENV:-dev}
    restart: ${POSTGRES_RESTART:-unless-stopped}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5437}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/init-postgres.sh:ro
      - ${BACKUP_DIR:-./database/backups/postgres_data}:/backups
    shm_size: 128mb
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.20", memory: 384M }
        reservations: { cpus: "0.05", memory: 96M }
    environment:
      <<: *database-env
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [pms-network]
    # Invoke via sh so a missing +x or noexec bind-mount does not fail
    # (git tracks this script as 100644; Linux clones are not executable).
    entrypoint: ["sh", "/init-postgres.sh"]
    command: >
      postgres
      -c timezone=Asia/Bangkok
      -c max_connections=20
      -c shared_buffers=64MB
      -c effective_cache_size=192MB
      -c maintenance_work_mem=32MB
      -c work_mem=2MB
      -c wal_buffers=4MB
      -c min_wal_size=64MB
      -c max_wal_size=256MB
      -c checkpoint_completion_target=0.9
      -c huge_pages=off
      -c random_page_cost=1.1

  migrations:
    build:
      context: .
      target: migrate
    container_name: pms-migrations-${APP_ENV:-dev}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [pms-network]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.40", memory: 256M }
        reservations: { cpus: "0.05", memory: 64M }
    environment:
      <<: *database-env
      APP_ENV: ${APP_ENV:-dev}
      SEED_PATH: ${SEED_PATH:-database/seeds/sql-master}
      SEEDS_ROOT: /app
      RUN_SEED: ${RUN_SEED:-false}
      DB_SCHEMA_SYNC_APPROVED: ${DB_SCHEMA_SYNC_APPROVED:-false}
      BACKUP_DIR: /run/pms-rollout-backups
      MIGRATION_MAX_ATTEMPTS: ${MIGRATION_MAX_ATTEMPTS:-3}
      NODE_OPTIONS: --max-old-space-size=192
    volumes:
      - ./prisma:/app/prisma
      - ./database/schema.sql:/app/database/schema.sql:ro
      - ./database/migrations:/app/database/migrations:ro
      - ./database/seeds:/app/database/seeds:ro
      - ./scripts:/app/scripts:ro
      - ./database/rollout:/app/database/rollout
      - ${BACKUP_DIR:-./database/backups/postgres_data}:/run/pms-rollout-backups:ro

  app:
    environment:
      RUNTIME_DOCKER: "true"
      <<: *database-env
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in root .env}
      OWNER_GATE_USERNAME: ${OWNER_GATE_USERNAME:?Set OWNER_GATE_USERNAME in root .env}
      OWNER_GATE_PASSWORD: ${OWNER_GATE_PASSWORD:?Set OWNER_GATE_PASSWORD in root .env}
      OWNER_USER_ID: ${OWNER_USER_ID:-}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks: [pms-network]
    logging: *logging

volumes:
  postgres_data:
    name: pms-postgres-data-${APP_ENV:-dev}
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_DATA_DIR:-./database/postgres/data}
    labels:
      com.dhas.project: project-management-system
      com.dhas.environment: ${APP_ENV:-dev}
      com.dhas.volume.type: database
      com.dhas.backup.frequency: daily
      com.dhas.retention.days: ${BACKUP_KEEP_DAYS:-30}

networks:
  pms-network:
    driver: bridge
