name: project-management-system-development

include:
  - docker-compose.database.yml

services:
  # Dev-only: skip fsync (do not use in UAT/prod). Memory matches the
  # shared 1 vCPU / 2 GB host budget (two projects).
  postgres:
    command: >
      postgres
      -c max_connections=20
      -c shared_buffers=64MB
      -c effective_cache_size=192MB
      -c maintenance_work_mem=32MB
      -c work_mem=2MB
      -c wal_buffers=4MB
      -c min_wal_size=64MB
      -c max_wal_size=256MB
      -c huge_pages=off
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off

  app:
    build:
      context: .
      target: development
    container_name: pms-app-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_ENV: development
      NEXTAUTH_SECRET: dev-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3000
      NODE_OPTIONS: --max-old-space-size=256
    ports:
      - "3777:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - /app/database/postgres
      - ./scripts/docker-entrypoint-dev.sh:/usr/local/bin/docker-entrypoint-dev.sh:ro
