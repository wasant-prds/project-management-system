# Docker Compose for Development Environment

name: project-management-system-development

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pms-postgres-dev
    restart: unless-stopped
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./scripts/init-postgres.sh:/init-postgres.sh:ro
    environment:
      # Performance optimizations for development
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=C
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$(cat /run/secrets/postgres_user) -d $$(cat /run/secrets/postgres_db)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pms-network
    entrypoint: ["/init-postgres.sh"]
    command: 
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "fsync=off"  # Dev only - improves performance
      - "-c"
      - "synchronous_commit=off"  # Dev only - improves performance
      - "-c"
      - "full_page_writes=off"  # Dev only - improves performance

  # Next.js Application (Development — hot reload)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: pms-app-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_ENV=development
      - NEXTAUTH_SECRET=dev-secret-change-in-production
      - NEXTAUTH_URL=http://localhost:3000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      # Bind-mount source for live reload; keep container node_modules/.next
      - .:/app
      - /app/node_modules
      - /app/.next
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pms-network
    # DATABASE_URL + db:push/seed + pnpm dev → scripts/docker-entrypoint-dev.sh

networks:
  pms-network:
    driver: bridge

volumes:
  postgres_data_dev:
    name: pms-postgres-data-dev
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./database/postgres/data
    labels:
      - "com.dhas.project=project-management-system"
      - "com.dhas.environment=development"
      - "com.dhas.volume.type=database"
      - "com.dhas.backup.frequency=daily"
      - "com.dhas.retention.days=30"
      - "com.dhas.description=PostgreSQL persistent data volume"

secrets:
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  postgres_db:
    file: ./secrets/postgres_db.txt
